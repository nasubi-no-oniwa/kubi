# ランキングのルールが本当に効くかを確かめる（試しの記録は最後に消す）
name: ランキングのルールを確かめる
on:
  push:
    branches: [main]
    paths:
      - 'tools/test-rules.mjs'
      - '.github/workflows/test.yml'
  workflow_dispatch:
concurrency:
  group: kubi-rules-test
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 道具を入れる
        run: mkdir -p "$RUNNER_TEMP/x" && cd "$RUNNER_TEMP/x" && npm init -y >/dev/null && npm i google-auth-library@9 --silent
      - name: 鍵を一時ファイルに書く
        env:
          SA: ${{ secrets.OTOKONOJI_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "OTOKONOJI_SERVICE_ACCOUNT が登録されていません"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: ルールを確かめる
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node tools/test-rules.mjs
      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
